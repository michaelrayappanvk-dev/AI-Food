<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login - FOODAI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-box">

    <h1>FOOD<span>AI</span></h1>

    <h2>Customer Login</h2>

    <p>Enter your mobile number</p>

    <div id="phone-section">

        <input
            type="tel"
            id="phone"
            placeholder="+91 9876543210"
            autocomplete="tel"
        >

        <div id="recaptcha-container"></div>

        <button type="button" id="sendOtpBtn">
            Send OTP →
        </button>

    </div>


    <div id="otp-section" style="display:none;">

        <p>Enter the OTP sent to your mobile</p>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6 digit OTP"
            maxlength="6"
            inputmode="numeric"
        >

        <button type="button" id="verifyOtpBtn">
            Verify OTP →
        </button>

    </div>

    <p id="message"></p>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyAsZDZviA2r56cdgMB1bGDdfcr5e6IyLRY",

    authDomain: "foodai-5ed36.firebaseapp.com",

    projectId: "foodai-5ed36",

    storageBucket: "foodai-5ed36.firebasestorage.app",

    messagingSenderId: "448904187365",

    appId: "1:448904187365:web:313abec8e4ef345529f30c",

    measurementId: "G-Y9NKBRRC8Z"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


let confirmationResult;


const message =
    document.getElementById("message");


/* =========================
   RECAPTCHA
========================= */

const recaptchaVerifier =
    new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        {
            size: "normal"
        }
    );


/* =========================
   SEND OTP
========================= */

document
.getElementById("sendOtpBtn")
.addEventListener("click", async function () {

    const phone =
        document.getElementById("phone").value.trim();


    if (!phone) {

        message.innerText =
            "Please enter your mobile number.";

        return;
    }


    try {

        message.innerText =
            "Sending OTP...";


        confirmationResult =
            await signInWithPhoneNumber(
                auth,
                phone,
                recaptchaVerifier
            );


        document.getElementById(
            "otp-section"
        ).style.display = "block";


        message.innerText =
            "OTP sent successfully!";


    } catch (error) {

        console.error(error);

        message.innerText =
            "OTP Error: " + error.message;

        try {
            recaptchaVerifier.clear();
        } catch (e) {}

    }

});


/* =========================
   VERIFY OTP
========================= */

document
.getElementById("verifyOtpBtn")
.addEventListener("click", async function () {

    const otp =
        document.getElementById("otp").value.trim();


    if (!otp) {

        message.innerText =
            "Please enter OTP.";

        return;
    }


    if (!confirmationResult) {

        message.innerText =
            "Please send OTP first.";

        return;
    }


    try {

        message.innerText =
            "Verifying OTP...";


        await confirmationResult.confirm(otp);


        message.innerText =
            "Login successful!";


        setTimeout(function () {

            window.location.href =
                "/customer-dashboard";

        }, 1000);


    } catch (error) {

        console.error(error);

        message.innerText =
            "Invalid OTP. Please try again.";

    }

});

</script>

</body>
</html>
